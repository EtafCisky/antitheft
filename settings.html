<div class="inline-drawer">
  <div class="inline-drawer-toggle inline-drawer-header">
    <b>角色卡防盗插件</b>
    <span class="antitheft-version-badge">v3.0.0</span>
    <div class="inline-drawer-icon fa-solid fa-circle-chevron-down"></div>
  </div>
  <div class="inline-drawer-content">
    <div class="antitheft-settings">
      <!-- 导入区域 -->
      <div class="range-block">
        <div class="antitheft-import-section">
          <button
            id="antitheft_import_button"
            class="menu_button menu_button_icon"
          >
            <i class="fa-solid fa-file-import"></i>
            <span>导入加密卡</span>
          </button>
          <input
            id="antitheft_import_file"
            type="file"
            accept=".png"
            style="display: none"
          />
        </div>
      </div>

      <!-- 可选设置 -->
      <div class="range-block">
        <label class="checkbox_label" for="antitheft_debug">
          <input id="antitheft_debug" type="checkbox" />
          <span>调试模式</span>
        </label>

        <div class="marginTop10">
          <label for="antitheft_server_url">
            <span>服务器地址（可选）</span>
          </label>
          <input
            id="antitheft_server_url"
            class="text_pole"
            type="url"
            placeholder="留空使用卡片内置地址"
          />
        </div>
      </div>
    </div>
  </div>
</div>
